<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Supporto IT — Aria</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
    }

    .card {
      background: rgba(255,255,255,0.08);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 24px;
      padding: 48px 40px;
      width: 360px;
      text-align: center;
      box-shadow: 0 24px 48px rgba(0,0,0,0.4);
    }

    .avatar {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      background: linear-gradient(135deg, #4C9BE8, #a855f7);
      margin: 0 auto 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
      box-shadow: 0 0 0 0 rgba(76,155,232,0.4);
      transition: box-shadow 0.3s;
    }

    .avatar.ringing {
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0%   { box-shadow: 0 0 0 0   rgba(76,155,232,0.6); }
      70%  { box-shadow: 0 0 0 20px rgba(76,155,232,0);   }
      100% { box-shadow: 0 0 0 0   rgba(76,155,232,0);   }
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .subtitle {
      font-size: 0.875rem;
      color: rgba(255,255,255,0.55);
      margin-bottom: 28px;
    }

    .status-pill {
      display: inline-block;
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 0.82rem;
      font-weight: 500;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.2);
      margin-bottom: 32px;
      min-width: 180px;
      transition: background 0.3s, color 0.3s;
    }

    .status-pill.active {
      background: rgba(34,197,94,0.2);
      border-color: rgba(34,197,94,0.5);
      color: #86efac;
    }

    .status-pill.error {
      background: rgba(239,68,68,0.2);
      border-color: rgba(239,68,68,0.5);
      color: #fca5a5;
    }

    .btn {
      width: 100%;
      padding: 14px;
      border-radius: 14px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: transform 0.1s, opacity 0.2s;
    }

    .btn:active { transform: scale(0.97); }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }

    .btn-call {
      background: linear-gradient(135deg, #22c55e, #16a34a);
      color: #fff;
      box-shadow: 0 4px 16px rgba(34,197,94,0.35);
    }

    .btn-end {
      background: linear-gradient(135deg, #ef4444, #b91c1c);
      color: #fff;
      box-shadow: 0 4px 16px rgba(239,68,68,0.35);
    }

    .btn-mute {
      width: 100%;
      margin-top: 10px;
      padding: 10px;
      border-radius: 12px;
      font-size: 0.875rem;
      font-weight: 500;
      cursor: pointer;
      border: 1px solid rgba(255,255,255,0.2);
      background: rgba(255,255,255,0.08);
      color: #fff;
      transition: background 0.2s;
    }

    .btn-mute:hover { background: rgba(255,255,255,0.14); }

    .hint {
      margin-top: 20px;
      font-size: 0.75rem;
      color: rgba(255,255,255,0.35);
      line-height: 1.5;
    }

    #btn-mute { display: none; }
  </style>
</head>
<body>
<div class="card">
  <div class="avatar" id="avatar">🎙️</div>
  <h1>Aria</h1>
  <p class="subtitle">Supporto IT — Reset Password</p>

  <div class="status-pill" id="status">Pronto per la chiamata</div>

  <button class="btn btn-call" id="btn-call" onclick="startCall()">📞 Avvia chiamata</button>
  <button class="btn btn-end" id="btn-end" onclick="endCall()" style="display:none">📵 Termina chiamata</button>
  <button class="btn-mute" id="btn-mute" onclick="toggleMute()">🎤 Silenzia microfono</button>

  <p class="hint">
    La chiamata è diretta e cifrata via WebRTC.<br>
    Nessun numero di telefono necessario.
  </p>
</div>

<!-- LiveKit JS SDK from CDN -->
<script src="https://cdn.jsdelivr.net/npm/livekit-client@2/dist/livekit-client.umd.min.js"></script>

<audio id="remote-audio" autoplay></audio>

<script>
  const { Room, RoomEvent, Track, TrackSource } = LivekitClient;

  let room = null;
  let muted = false;

  function setStatus(text, cls = "") {
    const el = document.getElementById("status");
    el.textContent = text;
    el.className = "status-pill" + (cls ? " " + cls : "");
  }

  async function startCall() {
    document.getElementById("btn-call").disabled = true;
    setStatus("Connessione in corso…");

    let tokenData;
    try {
      const resp = await fetch("/token");
      if (!resp.ok) throw new Error(await resp.text());
      tokenData = await resp.json();
    } catch (err) {
      setStatus("Errore: " + err.message, "error");
      document.getElementById("btn-call").disabled = false;
      return;
    }

    room = new Room();

    room.on(RoomEvent.TrackSubscribed, (track, _pub, _participant) => {
      if (track.kind === Track.Kind.Audio) {
        track.attach(document.getElementById("remote-audio"));
      }
    });

    room.on(RoomEvent.TrackUnsubscribed, (track) => {
      track.detach();
    });

    room.on(RoomEvent.Disconnected, () => {
      resetUI("Chiamata terminata.");
    });

    room.on(RoomEvent.ParticipantConnected, (participant) => {
      if (participant.isAgent) {
        setStatus("Aria è in linea ✓", "active");
        document.getElementById("avatar").classList.remove("ringing");
      }
    });

    try {
      await room.connect(tokenData.url, tokenData.token);
      await room.localParticipant.setMicrophoneEnabled(true);
    } catch (err) {
      setStatus("Impossibile connettersi: " + err.message, "error");
      room = null;
      document.getElementById("btn-call").disabled = false;
      return;
    }

    document.getElementById("btn-call").style.display = "none";
    document.getElementById("btn-end").style.display = "block";
    document.getElementById("btn-mute").style.display = "block";

    // L'agente potrebbe essere già nella room al momento della connessione:
    // in quel caso ParticipantConnected scatta durante room.connect() e
    // verrebbe sovrascritto dal successivo setStatus. Controlliamo qui.
    const agentPresent = [...room.remoteParticipants.values()].some(p => p.isAgent);
    if (agentPresent) {
      setStatus("Aria è in linea ✓", "active");
    } else {
      setStatus("In attesa di Aria…");
      document.getElementById("avatar").classList.add("ringing");
    }
  }

  async function endCall() {
    if (room) {
      await room.disconnect();
      room = null;
    }
    resetUI("Chiamata terminata.");
  }

  async function toggleMute() {
    if (!room) return;
    muted = !muted;
    await room.localParticipant.setMicrophoneEnabled(!muted);
    const btn = document.getElementById("btn-mute");
    btn.textContent = muted ? "🔇 Riattiva microfono" : "🎤 Silenzia microfono";
  }

  function resetUI(msg = "Pronto per la chiamata") {
    setStatus(msg);
    document.getElementById("btn-call").style.display = "block";
    document.getElementById("btn-call").disabled = false;
    document.getElementById("btn-end").style.display = "none";
    document.getElementById("btn-mute").style.display = "none";
    document.getElementById("avatar").classList.remove("ringing");
    muted = false;
  }
</script>
</body>
</html>
